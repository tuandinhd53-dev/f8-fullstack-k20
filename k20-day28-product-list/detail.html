<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />

        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>Chi tiết sản phẩm</title>

        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    </head>

    <body class="min-h-screen bg-[#FFF5F8] text-[#4D3D3D] antialiased">
        <!-- Header -->
        <header class="border-b border-[#F3DCE2] bg-white shadow-sm">
            <div
                class="mx-auto flex max-w-7xl items-center px-4 py-4 sm:px-6 lg:px-8"
            >
                <a
                    href="./index.html"
                    class="inline-flex items-center gap-2 rounded-lg border border-[#F3C4D2] bg-white px-3 py-2 text-xs font-semibold text-[#4D3D3D] shadow-sm transition-all duration-200 hover:border-[#E94F7D] hover:bg-[#FFF0F4] hover:text-[#E94F7D] hover:shadow-md focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#E94F7D] sm:px-4 sm:text-sm"
                >
                    <span aria-hidden="true">←</span>

                    <span>Quay lại danh sách</span>
                </a>
            </div>
        </header>

        <!-- Main -->
        <main class="mx-auto max-w-7xl px-4 py-6 sm:px-6 sm:py-8 lg:px-8">
            <!-- Loading -->
            <div
                id="loading"
                class="hidden rounded-xl border border-[#F3DCE2] bg-white px-4 py-12 text-center shadow-sm"
            >
                <div
                    class="mx-auto mb-4 h-9 w-9 animate-spin rounded-full border-4 border-[#FFE1EC] border-t-[#E94F7D]"
                ></div>

                <p class="text-sm font-medium text-[#8A6F76]">
                    Đang tải sản phẩm...
                </p>
            </div>

            <!-- Error -->
            <div
                id="error"
                class="hidden rounded-xl border border-red-200 bg-red-50 px-4 py-8 text-center"
                aria-live="polite"
            >
                <div
                    class="mx-auto flex h-10 w-10 items-center justify-center rounded-full bg-red-100"
                >
                    <span
                        class="text-lg font-bold text-red-500"
                        aria-hidden="true"
                    >
                        !
                    </span>
                </div>

                <p class="mt-3 text-sm font-semibold text-red-600">
                    Không thể tải thông tin sản phẩm.
                </p>

                <p class="mt-1 text-xs text-red-500">Vui lòng thử lại sau.</p>
            </div>

            <!-- Product Detail -->
            <section
                id="product-detail"
                aria-label="Chi tiết sản phẩm"
                class="mt-6 sm:mt-8"
            >
                <!-- Product được render bằng detail.js -->
            </section>
        </main>

        <!-- Footer -->
        <footer class="mt-8 border-t border-[#F3DCE2] bg-white">
            <div
                class="mx-auto max-w-7xl px-4 py-6 text-center sm:px-6 lg:px-8"
            >
                <p class="text-xs text-[#A89B9B]">© 2026 Product Store</p>
            </div>
        </footer>

        <script src="./js/detail.js"></script>
    </body>
</html>
