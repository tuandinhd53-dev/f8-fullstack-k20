<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />

        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Spotify</title>

        <!-- Font -->
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />

        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    </head>

    <body class="min-h-screen bg-[#121212] text-white antialiased">
        <div class="min-h-screen">
            <!-- Header -->
            <header class="flex justify-center px-6 pt-8 sm:pt-10">
                <a
                    href="./index.html"
                    aria-label="Spotify Home"
                    class="transition-transform duration-200 hover:scale-105"
                >
                    <svg
                        role="img"
                        viewBox="0 0 26 26"
                        class="h-10 w-10 fill-white"
                        aria-hidden="true"
                    >
                        <path
                            d="M13.427.01C6.805-.253 1.224 4.902.961 11.524.698 18.147 5.853 23.728 12.476 23.99c6.622.263 12.203-4.892 12.466-11.514S20.049.272 13.427.01m5.066 17.579a.717.717 0 0 1-.977.268 14.4 14.4 0 0 0-5.138-1.747 14.4 14.4 0 0 0-5.42.263.717.717 0 0 1-.338-1.392c1.95-.474 3.955-.571 5.958-.29 2.003.282 3.903.928 5.647 1.92a.717.717 0 0 1 .268.978m1.577-3.15a.93.93 0 0 1-1.262.376 17.7 17.7 0 0 0-5.972-1.96 17.7 17.7 0 0 0-6.281.238.93.93 0 0 1-1.11-.71.93.93 0 0 1 .71-1.11 19.5 19.5 0 0 1 6.94-.262 19.5 19.5 0 0 1 6.599 2.165c.452.245.62.81.376 1.263m1.748-3.551a1.147 1.147 0 0 1-1.546.488 21.4 21.4 0 0 0-6.918-2.208 21.4 21.4 0 0 0-7.259.215 1.146 1.146 0 0 1-.456-2.246 23.7 23.7 0 0 1 8.034-.24 23.7 23.7 0 0 1 7.657 2.445c.561.292.78.984.488 1.546"
                        />
                    </svg>
                </a>
            </header>

            <!-- Main -->
            <main class="px-6 py-10 sm:py-12">
                <section class="mx-auto w-full max-w-[430px]">
                    <!-- Heading -->
                    <div class="mb-8 text-center">
                        <h1
                            class="text-4xl font-bold leading-tight tracking-[-1.5px] sm:text-5xl"
                        >
                            Sign up to start listening
                        </h1>

                        <p class="mt-3 text-sm text-[#B3B3B3]">
                            Create your account and start enjoying your music.
                        </p>
                    </div>

                    <!-- Form -->
                    <form id="register-form" class="space-y-5" novalidate>
                        <!-- Username -->
                        <div>
                            <label
                                for="username"
                                class="mb-2 block text-sm font-bold"
                            >
                                Username
                            </label>

                            <input
                                id="username"
                                name="username"
                                type="text"
                                autocomplete="username"
                                required
                                placeholder="Enter your username"
                                class="h-12 w-full rounded-md border border-[#727272] bg-[#121212] px-3 text-base text-white outline-none transition duration-200 placeholder:text-[#6a6a6a] hover:border-white focus:border-2 focus:border-white"
                            />

                            <p
                                id="username-error"
                                class="mt-2 hidden text-sm text-red-400"
                            ></p>
                        </div>

                        <!-- Email -->
                        <div>
                            <label
                                for="email"
                                class="mb-2 block text-sm font-bold"
                            >
                                Email address
                            </label>

                            <input
                                id="email"
                                name="email"
                                type="email"
                                autocomplete="email"
                                required
                                placeholder="name@domain.com"
                                class="h-12 w-full rounded-md border border-[#727272] bg-[#121212] px-3 text-base text-white outline-none transition duration-200 placeholder:text-[#6a6a6a] hover:border-white focus:border-2 focus:border-white"
                            />

                            <p
                                id="email-error"
                                class="mt-2 hidden text-sm text-red-400"
                            ></p>
                        </div>

                        <!-- Password -->
                        <div>
                            <label
                                for="password"
                                class="mb-2 block text-sm font-bold"
                            >
                                Password
                            </label>

                            <div class="relative">
                                <input
                                    id="password"
                                    name="password"
                                    type="password"
                                    autocomplete="new-password"
                                    required
                                    placeholder="Enter your password"
                                    class="h-12 w-full rounded-md border border-[#727272] bg-[#121212] px-3 pr-12 text-base text-white outline-none transition duration-200 placeholder:text-[#6a6a6a] hover:border-white focus:border-2 focus:border-white"
                                />
                            </div>

                            <p class="mt-2 text-xs leading-5 text-[#B3B3B3]">
                                Use at least 6 characters with uppercase,
                                lowercase and a number.
                            </p>

                            <p
                                id="password-error"
                                class="mt-2 hidden text-sm text-red-400"
                            ></p>
                        </div>

                        <!-- Display Name -->
                        <div>
                            <label
                                for="display-name"
                                class="mb-2 block text-sm font-bold"
                            >
                                Display name
                            </label>

                            <input
                                id="display-name"
                                name="display_name"
                                type="text"
                                autocomplete="name"
                                required
                                placeholder="Enter your profile name"
                                class="h-12 w-full rounded-md border border-[#727272] bg-[#121212] px-3 text-base text-white outline-none transition duration-200 placeholder:text-[#6a6a6a] hover:border-white focus:border-2 focus:border-white"
                            />

                            <p
                                id="display-name-error"
                                class="mt-2 hidden text-sm text-red-400"
                            ></p>
                        </div>

                        <!-- Bio -->
                        <div>
                            <label
                                for="bio"
                                class="mb-2 block text-sm font-bold"
                            >
                                Bio
                            </label>
                            <p
                                id="bio-error"
                                class="mt-2 hidden text-sm text-red-500"
                            ></p>

                            <textarea
                                id="bio"
                                name="bio"
                                rows="3"
                                maxlength="160"
                                placeholder="Tell us a little about yourself"
                                class="w-full resize-none rounded-md border border-[#727272] bg-[#121212] px-3 py-3 text-base text-white outline-none transition duration-200 placeholder:text-[#6a6a6a] hover:border-white focus:border-2 focus:border-white"
                            ></textarea>

                            <p class="mt-1 text-right text-xs text-[#6a6a6a]">
                                Max 160 characters
                            </p>
                        </div>

                        <!-- Country -->
                        <div>
                            <label
                                for="country"
                                class="mb-2 block text-sm font-bold"
                            >
                                Country
                            </label>

                            <select
                                id="country"
                                name="country"
                                required
                                class="h-12 w-full rounded-md border border-[#727272] bg-[#121212] px-3 text-base text-white outline-none transition duration-200 hover:border-white focus:border-2 focus:border-white"
                            >
                                <option value="" disabled selected>
                                    Select your country
                                </option>

                                <option value="Vietnam">Vietnam</option>
                                <option value="United States">
                                    United States
                                </option>
                                <option value="United Kingdom">
                                    United Kingdom
                                </option>
                                <option value="Japan">Japan</option>
                                <option value="South Korea">South Korea</option>
                                <option value="China">China</option>
                                <option value="Thailand">Thailand</option>
                                <option value="Singapore">Singapore</option>
                                <option value="Australia">Australia</option>
                                <option value="Canada">Canada</option>
                                <option value="France">France</option>
                                <option value="Germany">Germany</option>
                            </select>

                            <p
                                id="country-error"
                                class="mt-2 hidden text-sm text-red-400"
                            ></p>
                        </div>

                        <!-- API Error -->
                        <div
                            id="register-error"
                            class="hidden rounded-md border border-red-500/30 bg-red-500/10 px-4 py-3 text-sm text-red-400"
                        ></div>

                        <!-- Success -->
                        <p
                            id="register-success"
                            class="mt-4 hidden rounded-md border border-[#1ed760]/20 bg-[#1ed760]/10 px-4 py-3 text-center text-sm font-medium text-[#1ed760]"
                        ></p>

                        <!-- Submit -->
                        <button
                            id="register-button"
                            type="submit"
                            class="flex h-12 w-full items-center justify-center gap-2 rounded-full bg-[#1ed760] text-sm font-bold text-black transition duration-200 hover:scale-[1.02] hover:bg-[#1fdf64] active:scale-100 disabled:cursor-not-allowed disabled:opacity-50 disabled:hover:scale-100"
                        >
                            <i
                                id="register-loading"
                                class="fa-solid fa-spinner hidden animate-spin"
                            ></i>

                            <span id="register-button-text"> Sign up </span>
                        </button>
                    </form>

                    <!-- Login -->
                    <div class="mt-9 text-center">
                        <p class="text-sm text-[#B3B3B3]">
                            Already have an account?
                        </p>

                        <a
                            href="./login.html"
                            id="login-link"
                            class="mt-2 inline-block text-sm font-bold underline transition-colors hover:text-[#1ed760]"
                        >
                            Log in
                        </a>
                    </div>
                </section>
            </main>

            <!-- Footer -->
            <footer class="px-6 pb-8 pt-4">
                <div class="mx-auto max-w-[420px] text-center">
                    <p class="text-[11px] leading-4 text-[#6a6a6a]">
                        This site is protected by reCAPTCHA and the Google
                        <a
                            href="#"
                            class="underline transition-colors hover:text-[#B3B3B3]"
                        >
                            Privacy Policy
                        </a>
                        and
                        <a
                            href="#"
                            class="underline transition-colors hover:text-[#B3B3B3]"
                        >
                            Terms of Service
                        </a>
                        apply.
                    </p>
                </div>
            </footer>
        </div>
        <script src="./js/api.js"></script>
        <script src="./js/register.js"></script>
    </body>
</html>
