<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>

        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body class="min-h-screen bg-gray-100 flex items-center justify-center">
        <div
            id="todo-app"
            class="bg-white w-full max-w-md p-6 rounded-xl shadow-lg"
        >
            <h1 class="text-2xl font-bold text-center mb-5 text-gray-800">
                Todo List
            </h1>

            <div class="flex gap-2">
                <input
                    type="text"
                    id="todo-input"
                    placeholder="Nhập việc cần làm..."
                    class="flex-1 border border-gray-300 rounded-lg px-4 py-2 outline-none focus:ring-2 focus:ring-blue-400"
                />

                <button
                    id="add-btn"
                    class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 transition"
                >
                    Thêm
                </button>
            </div>

            <ul id="todo-list" class="mt-5 space-y-2"></ul>

            <p id="todo-count" class="mt-5 text-gray-600 text-sm text-center">
                Còn 0 việc chưa xong
            </p>
        </div>

        <script src="./baitap1.js"></script>
    </body>
</html>
